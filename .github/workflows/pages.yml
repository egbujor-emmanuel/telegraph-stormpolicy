name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}
  # The monitor commits each sweep summary, but GitHub will not let a push
  # made by a workflow trigger another workflow -- so the agent published
  # while the site kept serving the previous run. Deploying when the monitor
  # finishes closes that gap.
  workflow_run:
    workflows: ["StormPolicy Monitor"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
