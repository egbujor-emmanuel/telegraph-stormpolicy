name: StormPolicy Monitor

# Runs the autonomous corroboration-and-trigger sweep on a schedule. Free
# and unlimited for public repos, no server to keep alive, no spin-down --
# a scheduled job that runs and exits, not a process waiting for traffic.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # manual "Run workflow" button for on-demand checks

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Check all active policies against live Telegraph signals
        env:
          TEST_WALLET_PRIVATE_KEY: ${{ secrets.TEST_WALLET_PRIVATE_KEY }}
        run: node -e "import('./src/monitor.mjs').then(m => m.checkAllPolicies())"

      # Bonded contract: finalize anything whose dispute window closed
      # unchallenged, then stake a bonded assertion for any active policy
      # whose live signals now corroborate.
      - name: Sweep the bonded contract (finalize matured, assert new)
        env:
          TEST_WALLET_PRIVATE_KEY: ${{ secrets.TEST_WALLET_PRIVATE_KEY }}
        run: node scripts/sweep-bonded.mjs

      # Publish the agent's own reasoning so the site can show it. Committing
      # the summary is what makes each sweep visible to someone who never
      # opens a block explorer.
      - name: Publish the sweep summary
        run: |
          if git diff --quiet -- public/data/latest-sweep.json; then
            echo "no change in sweep summary"
            exit 0
          fi
          git config user.name  "stormpolicy-agent"
          git config user.email "agent@users.noreply.github.com"
          git add public/data/latest-sweep.json
          git commit -m "Publish sweep $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push
